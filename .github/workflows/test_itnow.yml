name: Test lectura incidencias ITNOW

on:
  workflow_dispatch:

jobs:

  leer-incidencias:

    runs-on: ubuntu-latest

    steps:

      - name: Leer incidencias de ServiceNow
        env:
          SNOW_USERNAME: ${{ secrets.SNOW_USERNAME }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}

        run: |

          echo "=========================================="
          echo " TEST API SERVICENOW / ITNOW"
          echo "=========================================="
          echo ""

          HTTP_CODE=$(curl \
            -s \
            -u "$SNOW_USERNAME:$SNOW_PASSWORD" \
            -o /tmp/incidencias.json \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --get \
            "https://iberdrola.service-now.com/api/now/table/incident" \
            --data-urlencode "sysparm_limit=5" \
            --data-urlencode "sysparm_fields=sys_id,number,short_description,state,priority,assignment_group,cmdb_ci,sys_created_on,sys_updated_on" \
            --data-urlencode "sysparm_display_value=all" \
            -H "Accept: application/json")

          echo "HTTP status: $HTTP_CODE"
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR leyendo ServiceNow"
            echo ""
            echo "Respuesta:"
            cat /tmp/incidencias.json

            exit 1

          fi

          echo "Conexion API correcta."
          echo ""
          echo "=========================================="
          echo " INCIDENCIAS DEVUELTAS"
          echo "=========================================="
          echo ""

          python -m json.tool /tmp/incidencias.json
